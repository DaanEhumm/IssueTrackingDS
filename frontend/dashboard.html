<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Ticket Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Ticket Dashboard</h1>
        <button id="logoutBtn" class="btn btn-secondary" type="button">Logout</button>
    </div>

    <div class="row mb-3">
        <div class="col-md-3">
            <select id="statusFilter" class="form-select">
                <option value="">Alle statussen</option>
                <option value="Open">Open</option>
                <option value="InProgress">In Progress</option>
                <option value="Closed">Closed</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="priorityFilter" class="form-select">
                <option value="">Alle prioriteiten</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>
        <div class="col-md-3">
            <button id="filterBtn" class="btn btn-primary w-100" type="button">Filter</button>
        </div>
        <div class="col-md-3">
            <button id="addTicketBtn" class="btn btn-success w-100" type="button"> +Add Ticket</button>
        </div>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Titel</th>
                <th>Status</th>
                <th>Prioriteit</th>
                <th>Gebruiker</th>
                <th>Acties</th>
            </tr>
        </thead>
        <tbody id="ticketTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
<script src="dashboardScript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
