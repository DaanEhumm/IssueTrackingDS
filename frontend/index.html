<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IssueTracker - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-5">
    <div class="card mx-auto">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">IssueTracker Login</h3>

            <div class="mb-3">

            <label for="username">Gebruikersnaam</label>
            <input id="username" type="text" class="form-control" placeholder="Vul je gebruikersnaam in">
            </div>

            <div class="mb-3">
                <label for="password">Wachtwoord</label>
                <input id="password" type="password" class="form-control" placeholder="Vul je wachtwoord in">
            </div>

            <div class="mb-3">
                <label for="role">Rol</label>
                <select id="role" class="form-select">
                <option value="user">User</option>
                <option value="admin">Admin</option> <!-- allen log in handmatig admin maken -->
                </select>
            </div>

            <button id="loginBtn" class="btn btn-primary w-100 mb-2" type="button">Login</button>
            <button id="registerBtn" class="btn btn-secondary w-100" type="button">Register</button>

            <p id="message" class="text-danger mt-2"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
