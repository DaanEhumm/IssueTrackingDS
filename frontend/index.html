<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" >
  <meta name="viewport" content="width=device-width,initial-scale=1" >
  <title>IssueTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero bg-primary text-white text-center py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">IssueTracker</h1>
      <p class="lead">Snel bugs melden, prioriteren en oplossen — simpel en overzichtelijk.</p>
      <div class="d-flex justify-content-center gap-3 mt-4">
        <button id="toLogin" class="btn btn-light btn-lg" type="button">Inloggen</button>
        <button id="toRegister" class="btn btn-outline-light btn-lg" type="button">Registreren</button>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <!-- Login / Register card (reused) -->
        <div id="authCard" class="card shadow-sm">
          <div class="card-body">
            <h3 id="authTitle" class="card-title text-center mb-3">Inloggen</h3>

            <div class="mb-3">
              <label for="username" class="form-label">Gebruikersnaam</label>
              <input id="username" type="text" class="form-control" placeholder="Vul je gebruikersnaam in">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Wachtwoord</label>
              <input id="password" type="password" class="form-control" placeholder="Vul je wachtwoord in">
            </div>

            <p id="message" class="text-danger"></p>

            <div class="d-grid gap-2">
              <button id="loginBtn" class="btn btn-primary" type="button">Inloggen</button>
              <button id="registerBtn" class="btn btn-secondary d-none" type="button">Registreren</button>
            </div>

            <div class="text-center mt-3 small text-muted">
              <span id="switchText">Nog geen account?</span>
              <button id="switchBtn" class="btn btn-link p-0" type="button">Maak er één aan</button>
            </div>
          </div>
        </div>

        <p class="text-center mt-3 small text-muted">-IssueTrackerDS-</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
