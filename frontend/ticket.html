<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Ticket Bewerken</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-3" id="ticketTitle">Ticket Bewerken / Aanmaken</h3>

            <div class="mb-3">
                <label>Titel</label>
                <input id="title" class="form-control" type="text" placeholder="Titel">
            </div>

            <div class="mb-3">
                <label>Beschrijving</label>
                <textarea id="description" class="form-control" placeholder="Beschrijving"></textarea>
            </div>

            <div class="mb-3 row">
                <div class="col-md-4">
                    <label>Status</label>
                    <select id="status" class="form-select">
                        <option value="Open">Open</option>
                        <option value="InProgress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Prioriteit</label>
                    <select id="priority" class="form-select">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="col-md-4" id="assignedCol" style="display:none">
                    <label>Assigned To</label>
                    <select id="assignedTo" class="form-select"></select>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button id="saveTicketBtn" class="btn btn-primary" type="button">Opslaan</button>
                <button id="cancelBtn" class="btn btn-secondary" type="button">Annuleren</button>
                <button id="deleteBtn" class="btn btn-danger ms-auto" type="button" style="display:none">Verwijderen</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="ticketScript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
